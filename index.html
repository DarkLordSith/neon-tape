<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Tape">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Неоновая кассета</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one hardware deck — cassette window, LCD, transport keys, shift log. Single committed dark neon look. */
:root{
  color-scheme:dark;
  --bg:#0a0811; --shell:#17131f; --shell-2:#211b2b; --edge:#3a3148;
  --ink:#ece6f5; --dim:#8f86a3; --pink:#ff4f9a; --cyan:#3fe6ff; --amber:#ffb84d;
  --lcd:#061719; --lcd-ink:#7ff3ff; --lcd-dim:#2f7c86; --tape:#3b261c; --hub:#d9d3e3;
  --f-display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-mono:"Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html,body{min-height:100%}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--pink) 18%, transparent), transparent 60%),
    radial-gradient(90% 50% at 100% 110%, color-mix(in srgb, var(--cyan) 12%, transparent), transparent 60%),
    var(--bg);
  color:var(--ink); font-family:var(--f-display);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 32px;
  display:flex; justify-content:center;
}
.deck{width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px}
.brand{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.brand h1{margin:0; font-size:1.15rem; letter-spacing:.18em; text-transform:uppercase; font-weight:700}
.brand h1 span{color:var(--pink)}
.brand small{font-family:var(--f-mono); color:var(--dim); font-size:.72rem; letter-spacing:.08em}

.body{
  background:linear-gradient(180deg, var(--shell-2), var(--shell));
  border:1px solid var(--edge); border-radius:18px; padding:14px;
  box-shadow:0 0 0 1px #000 inset, 0 24px 60px -20px color-mix(in srgb, var(--pink) 35%, transparent);
  display:flex; flex-direction:column; gap:14px;
}
.cassette svg{display:block; width:100%; height:auto; max-width:100%}

.lcd{
  background:var(--lcd); border-radius:10px; padding:12px 14px;
  border:1px solid color-mix(in srgb, var(--cyan) 25%, var(--edge));
  font-family:var(--f-mono); color:var(--lcd-ink);
  text-shadow:0 0 6px color-mix(in srgb, var(--cyan) 55%, transparent);
  display:flex; flex-direction:column; gap:8px; font-variant-numeric:tabular-nums;
}
.lcd-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.big{font-size:2.1rem; letter-spacing:.04em; line-height:1}
.big .of{font-size:.9rem; color:var(--lcd-dim)}
.state{font-size:.78rem; letter-spacing:.12em; color:var(--pink); text-shadow:0 0 6px color-mix(in srgb, var(--pink) 60%, transparent)}
.shift{position:relative; height:10px; border:1px solid var(--lcd-dim); border-radius:2px; overflow:hidden}
.shift i{position:absolute; inset:0 auto 0 0; width:0; background:var(--lcd-ink); box-shadow:0 0 8px var(--cyan)}
.shift .ticks{position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 calc(100%/16 - 1px), var(--lcd) calc(100%/16 - 1px) calc(100%/16))}
.scale{display:flex; justify-content:space-between; font-size:.62rem; color:var(--lcd-dim)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.stats div{display:flex; flex-direction:column; gap:2px; min-width:0}
.stats b{font-weight:400; font-size:1.05rem}
.stats span{font-size:.62rem; letter-spacing:.14em; color:var(--lcd-dim)}
.meta{display:flex; justify-content:space-between; gap:8px; font-size:.72rem; color:var(--lcd-dim)}
.vu{display:flex; flex-direction:column; gap:3px}
.vu div{height:4px; width:0; background:linear-gradient(90deg, var(--cyan), var(--cyan) 70%, var(--amber) 85%, var(--pink)); transition:width .08s linear}

.alert{
  border:1px solid var(--pink); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px;
  background:color-mix(in srgb, var(--pink) 10%, var(--shell));
  animation:pulse 2.4s ease-in-out infinite;
}
.alert p{margin:0; line-height:1.4; font-size:.92rem}
.alert .row{display:flex; gap:8px; flex-wrap:wrap}
@keyframes pulse{50%{box-shadow:0 0 22px -4px var(--pink)}}

.keys{display:grid; grid-template-columns:1fr 1.5fr 1fr 1.3fr; gap:8px}
button{
  font:inherit; color:var(--ink); cursor:pointer;
  background:linear-gradient(180deg, #2c2538, #1b1623); border:1px solid var(--edge);
  border-bottom-width:4px; border-radius:8px; padding:12px 8px; min-height:52px;
  font-weight:600; letter-spacing:.06em; font-size:.86rem;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:transform .05s, border-bottom-width .05s;
}
button:active{transform:translateY(2px); border-bottom-width:2px}
button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
button.main{color:var(--bg); background:linear-gradient(180deg, var(--cyan), color-mix(in srgb, var(--cyan) 70%, #000)); border-color:color-mix(in srgb, var(--cyan) 60%, #000)}
button.main.on{background:linear-gradient(180deg, var(--pink), color-mix(in srgb, var(--pink) 65%, #000)); border-color:color-mix(in srgb, var(--pink) 55%, #000)}
button.ghost{min-height:40px; padding:8px 12px; font-size:.8rem}
button.hot{background:var(--pink); color:var(--bg); border-color:color-mix(in srgb, var(--pink) 55%, #000)}
.vol{display:flex; align-items:center; gap:10px; font-family:var(--f-mono); font-size:.72rem; color:var(--dim); letter-spacing:.1em}
.vol input{flex:1; accent-color:var(--pink); min-width:0}

.hint{font-size:.88rem; line-height:1.45; color:var(--dim); margin:0; min-height:2.6em}
.hint b{color:var(--ink); font-weight:600}
.foot{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--f-mono); font-size:.72rem; color:var(--dim)}
.playlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; font-family:var(--f-mono); font-size:.8rem}
.playlist li{display:flex; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:6px; color:var(--dim); cursor:pointer}
.playlist li.cur{color:var(--amber); background:color-mix(in srgb, var(--amber) 8%, transparent)}
.playlist li span:last-child{white-space:nowrap}
@media (prefers-reduced-motion: reduce){.alert{animation:none}.vu div{transition:none}}
</style>

</head>
<body>
<main class="deck">
  <header class="brand">
    <h1>Neon<span>/</span>Tape</h1>
    <small>FOCUS DECK · C-480</small>
  </header>

  <section class="body">
    <div class="cassette">
      <svg viewBox="0 0 340 214" role="img" aria-label="Кассета">
        <defs>
          <linearGradient id="cs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2236"/><stop offset="1" stop-color="#151119"/></linearGradient>
        </defs>
        <rect x="4" y="4" width="332" height="206" rx="14" fill="url(#cs)" stroke="#3a3148"/>
        <rect x="18" y="16" width="304" height="142" rx="8" fill="#ece6f5"/>
        <rect x="18" y="16" width="304" height="26" rx="8" fill="#ff4f9a"/>
        <rect x="18" y="34" width="304" height="8" fill="#ff4f9a"/>
        <text x="30" y="34" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="14" fill="#0a0811" letter-spacing="2">SIDE A</text>
        <text id="tNum" x="310" y="34" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="13" fill="#0a0811">01/06</text>
        <text id="tName" x="30" y="60" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="15" fill="#0a0811" letter-spacing="1">NEON RAIN</text>
        <rect x="62" y="70" width="216" height="74" rx="37" fill="#07060b" stroke="#3a3148"/>
        <g id="tapeLines" stroke="#3b261c" stroke-width="2" fill="none"></g>
        <circle id="packL" cx="112" cy="107" r="40" fill="#3b261c"/>
        <circle id="packR" cx="228" cy="107" r="24" fill="#3b261c"/>
        <g id="hubL" transform="translate(112 107)"></g>
        <g id="hubR" transform="translate(228 107)"></g>
        <rect x="150" y="96" width="40" height="22" rx="3" fill="#120f18" stroke="#3a3148"/>
        <path d="M78 210 L92 172 H248 L262 210" fill="#120f18" stroke="#3a3148"/>
        <circle cx="112" cy="192" r="5" fill="#07060b"/><circle cx="228" cy="192" r="5" fill="#07060b"/>
        <rect x="160" y="184" width="20" height="14" rx="2" fill="#07060b"/>
      </svg>
    </div>

    <div class="lcd" aria-live="polite">
      <div class="lcd-top">
        <div class="big" id="sess">00:00:00<span class="of"> / 08:00</span></div>
        <div class="state" id="state">STOP</div>
      </div>
      <div class="shift" title="Смена 8 часов, деление — 30 минут"><i id="shiftBar"></i><div class="ticks"></div></div>
      <div class="scale"><span>0ч</span><span>2ч</span><span>4ч</span><span>6ч</span><span>8ч</span></div>
      <div class="stats">
        <div><span>ФОКУС</span><b id="focus">00:00</b></div>
        <div><span>ПАУЗЫ</span><b id="pauses">0 · 0м</b></div>
        <div><span>ПЕРЕРЫВЫ</span><b id="breaks">0</b></div>
      </div>
      <div class="meta"><span id="tInfo">72 BPM · D MAJ</span><span id="tTime">0:00 / 3:20</span></div>
      <div class="vu" aria-hidden="true"><div id="vuL"></div><div id="vuR"></div></div>
    </div>

    <div class="alert" id="alert" hidden>
      <p id="alertText"></p>
      <div class="row" id="alertRow"></div>
    </div>

    <div class="keys">
      <button id="prev" aria-label="Предыдущий трек">◀◀</button>
      <button id="play" class="main" aria-label="Играть">▶ PLAY</button>
      <button id="next" aria-label="Следующий трек">▶▶</button>
      <button id="brk">ПЕРЕРЫВ</button>
    </div>
    <label class="vol" for="vol">VOL <input id="vol" type="range" min="0" max="100" value="70"></label>
  </section>

  <p class="hint" id="hint">Нажми <b>PLAY</b>, чтобы начать смену. Музыка генерируется прямо в браузере, без интернета.</p>

  <ul class="playlist" id="playlist"></ul>

  <div class="foot">
    <span>Блок 50 мин · перерыв 10 мин · каждый 4-й 20 мин</span>
    <button class="ghost" id="reset">Новая смена</button>
  </div>
</main>

<script>
(() => {
/* ---------- конфиг ---------- */
const H = 3600e3, MIN = 60e3;
const SHIFT = 8 * H, FOCUS = 50 * MIN, LONG_PAUSE = 5 * MIN, SNOOZE = 10 * MIN;
const KEY = 'neon-tape-v1';

const Q = { maj7:[0,4,7,11,14], m7:[0,3,7,10,14], dom7:[0,4,7,10,14] };
const TRACKS = [
  { name:'NEON RAIN',      bpm:72, root:50, key:'D MAJ', mode:'maj', swing:.18, prog:[[0,'maj7'],[9,'m7'],[2,'m7'],[7,'dom7']], kick:[0,7,10], bass:[0,7,10], mel:.16 },
  { name:'CHROME DISTRICT',bpm:80, root:57, key:'A MIN', mode:'min', swing:.12, prog:[[0,'m7'],[5,'m7'],[8,'maj7'],[7,'dom7']],  kick:[0,6,10], bass:[0,6,10,14], mel:.12 },
  { name:'NIGHT MARKET',   bpm:68, root:53, key:'F MAJ', mode:'maj', swing:.22, prog:[[0,'maj7'],[2,'m7'],[4,'m7'],[5,'maj7']],  kick:[0,10],   bass:[0,10], mel:.2 },
  { name:'SYNTH SPRAWL',   bpm:76, root:52, key:'E MIN', mode:'min', swing:.15, prog:[[0,'m7'],[3,'maj7'],[10,'dom7'],[5,'m7']], kick:[0,3,8,11], bass:[0,3,8,11], mel:.14 },
  { name:'LOW BATTERY',    bpm:70, root:48, key:'C MAJ', mode:'maj', swing:.2,  prog:[[5,'maj7'],[4,'m7'],[2,'m7'],[0,'maj7']],  kick:[0,7,9],  bass:[0,7,9], mel:.18 },
  { name:'AFTER HOURS',    bpm:74, root:55, key:'G MIN', mode:'min', swing:.16, prog:[[0,'m7'],[8,'maj7'],[3,'maj7'],[7,'m7']],  kick:[0,10,13],bass:[0,10,13], mel:.15 },
];
const SCALE = { maj:[0,2,4,7,9], min:[0,3,5,7,10] };
TRACKS.forEach(t => { const bar = 240 / t.bpm; t.bars = Math.max(32, Math.round(200 / bar / 4) * 4); t.steps = t.bars * 16; t.len = t.bars * bar; });

/* ---------- состояние ---------- */
const today = () => new Date().toISOString().slice(0,10);
const fresh = () => ({ day:today(), played:0, streak:0, pauses:0, pauseMs:0, breaks:0, shortInStreak:0, ti:0, step:0, snoozeUntil:0 });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch { S = null; }
if (!S || S.day !== today()) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

let mode = 'stop';          // stop | play | pause | break | ready | done
let pauseStart = 0, breakStart = 0, breakEnd = 0, breakLen = 0, alertKind = '';

/* ---------- аудио ---------- */
let ctx, master, music, tone, analyser, delay, lfoGain, noiseBuf, hiss;
let nextTime = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = vol();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  master.connect(comp).connect(ctx.destination);

  music = ctx.createGain(); music.gain.value = 0;               // шина музыки: её глушим на паузе
  tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 3800; // «плёночная» тусклость
  music.connect(tone).connect(master);
  analyser = ctx.createAnalyser(); analyser.fftSize = 512; tone.connect(analyser);

  delay = ctx.createDelay(1.5); delay.delayTime.value = 0.42;
  const fb = ctx.createGain(); fb.gain.value = .33;
  const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 1800;
  delay.connect(dlp).connect(fb).connect(delay); dlp.connect(music);

  const lfo = ctx.createOscillator(); lfo.frequency.value = .35;   // wow & flutter
  lfoGain = ctx.createGain(); lfoGain.gain.value = 7; lfo.connect(lfoGain); lfo.start();

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  hiss = ctx.createBufferSource(); hiss.buffer = noiseBuf; hiss.loop = true;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000;
  const hg = ctx.createGain(); hg.gain.value = .012;
  hiss.connect(hp).connect(hg).connect(music); hiss.start();
}

function env(g, t, peak, a, dec) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function chord(t, notes, dur) {
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500; f.connect(music);
  notes.forEach(n => {
    ['sine','triangle'].forEach((type, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = mtof(n); o.detune.value = k ? 6 : -4; lfoGain.connect(o.detune);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(k ? .018 : .045, t + .04);
      g.gain.exponentialRampToValueAtTime(k ? .006 : .018, t + dur * .7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + .4);
      o.connect(g).connect(f); o.start(t); o.stop(t + dur + .5);
    });
  });
}
function bass(t, m, dur) {
  const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
  o.type = 'sine'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.frequency.value = 400;
  env(g, t, .2, .02, dur); o.connect(f).connect(g).connect(music); o.start(t); o.stop(t + dur + .1);
}
function kick(t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  env(g, t, .45, .005, .3); o.connect(g).connect(music); o.start(t); o.stop(t + .4);
}
function noise(t, type, freq, peak, dec, q = 1) {
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  env(g, t, peak, .003, dec); s.connect(f).connect(g).connect(music);
  s.start(t, Math.random() * 1.5); s.stop(t + dec + .05);
}
function lead(t, m) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = mtof(m); lfoGain.connect(o.detune);
  env(g, t, .05, .02, .7); o.connect(g); g.connect(music); g.connect(delay); o.start(t); o.stop(t + .8);
}
function chime() {
  if (!ctx) return;
  const t = ctx.currentTime + .05;
  [880, 1318.5, 1760].forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f; env(g, t + i * .22, .12, .01, 1.1);
    o.connect(g).connect(master); o.start(t + i * .22); o.stop(t + i * .22 + 1.2);
  });
}

function scheduleStep(t, s, time, sd) {
  const bar = Math.floor(s / 16), pos = s % 16;
  const [deg, q] = t.prog[bar % 4];
  let r = t.root + deg; if (r > t.root + 6) r -= 12;
  const drums = bar >= 4 && bar < t.bars - 2;
  if (pos === 0) chord(time, Q[q].map(i => r + i), sd * 16);
  if (t.bass.includes(pos)) bass(time, r - 12, sd * 3);
  if (drums) {
    if (t.kick.includes(pos)) kick(time);
    if (pos === 4 || pos === 12) noise(time, 'bandpass', 1700, .14, .2, .8);
    if (pos % 2 === 0) noise(time, 'highpass', 7500, pos % 4 ? .025 : .04, .05);
    else if (Math.random() < .15) noise(time, 'highpass', 8000, .012, .03);
  }
  if (bar >= 8 && pos % 2 === 0 && Math.random() < t.mel) {
    const sc = SCALE[t.mode]; lead(time, t.root + 24 + sc[Math.floor(Math.random() * sc.length)] + (Math.random() < .25 ? 12 : 0));
  }
  if (Math.random() < .06) noise(time + Math.random() * sd, 'highpass', 1200, .03 + Math.random() * .05, .004);
}

function scheduler() {
  if (mode !== 'play' || !ctx) return;
  const ahead = document.hidden ? 1.5 : .2;     // в фоне таймеры тормозят — планируем дальше
  while (nextTime < ctx.currentTime + ahead) {
    const t = TRACKS[S.ti], sd = 60 / t.bpm / 4;
    scheduleStep(t, S.step, nextTime + (S.step % 2 ? t.swing * sd : 0), sd);
    nextTime += sd; S.step++;
    if (S.step >= t.steps) { S.ti = (S.ti + 1) % TRACKS.length; S.step = 0; nextTime += 1.4; renderTrack(); }
  }
}
setInterval(scheduler, 25);

function fadeMusic(on) {
  const g = music.gain, t = ctx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(on ? 1 : 0, t + (on ? .3 : .6));
}

/* ---------- управление ---------- */
const $ = id => document.getElementById(id);
const vol = () => Math.pow($('vol').value / 100, 1.6);

function play() {
  initAudio(); ctx.resume();
  const now = Date.now();
  if (mode === 'pause') {
    const d = now - pauseStart; S.pauseMs += d;
    if (d >= LONG_PAUSE) countBreak(); else S.shortInStreak++;
  }
  if (mode === 'break') endBreak(now - breakStart >= LONG_PAUSE);
  if (mode === 'done') return;
  mode = 'play'; nextTime = ctx.currentTime + .1; fadeMusic(true); wake(); render();
}
function pause() {
  if (mode !== 'play') return;
  mode = 'pause'; pauseStart = Date.now(); S.pauses++; fadeMusic(false); save(); render();
}
function countBreak() { S.breaks++; S.streak = 0; S.shortInStreak = 0; S.snoozeUntil = 0; }
function startBreak() {
  initAudio();
  if (mode === 'play') fadeMusic(false);
  if (mode === 'pause') S.pauseMs += Date.now() - pauseStart;
  breakLen = (S.breaks + 1) % 4 === 0 ? 20 * MIN : 10 * MIN;
  mode = 'break'; breakStart = Date.now(); breakEnd = breakStart + breakLen; hideAlert(); save(); render();
}
function endBreak(counted) { if (counted) countBreak(); breakEnd = 0; hideAlert(); }
function skip(dir) {
  initAudio();
  S.ti = (S.ti + dir + TRACKS.length) % TRACKS.length; S.step = 0;
  if (ctx) nextTime = ctx.currentTime + .15;
  renderTrack(); save();
}

$('play').onclick = () => mode === 'play' ? pause() : play();
$('prev').onclick = () => skip(-1);
$('next').onclick = () => skip(1);
$('brk').onclick = () => mode === 'break' ? play() : startBreak();
$('vol').oninput = () => { if (master) master.gain.setTargetAtTime(vol(), ctx.currentTime, .05); };
let resetArmed = 0;
$('reset').onclick = () => {
  if (Date.now() - resetArmed > 3000) { resetArmed = Date.now(); $('reset').textContent = 'Точно? Жми ещё раз'; $('reset').classList.add('hot'); return; }
  if (ctx && mode === 'play') fadeMusic(false);
  S = fresh(); mode = 'stop'; hideAlert(); save(); renderTrack(); render();
  $('reset').textContent = 'Новая смена'; $('reset').classList.remove('hot');
};
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); $('play').click(); } });

/* Wake Lock — чтобы экран не гас во время смены */
let lock = null;
async function wake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && mode === 'play') wake(); save(); });
addEventListener('pagehide', save);

/* Media Session — кнопки на экране блокировки, где поддерживается */
try {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', pause);
  navigator.mediaSession.setActionHandler('nexttrack', () => skip(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => skip(-1));
} catch {}

/* ---------- алерты ---------- */
function showAlert(kind, text, buttons) {
  alertKind = kind; $('alertText').textContent = text; const row = $('alertRow'); row.innerHTML = '';
  buttons.forEach(([label, fn, hot]) => { const b = document.createElement('button'); b.className = 'ghost' + (hot ? ' hot' : ''); b.textContent = label; b.onclick = fn; row.append(b); });
  $('alert').hidden = false;
}
function hideAlert() { alertKind = ''; $('alert').hidden = true; }

/* ---------- такт таймера ---------- */
let last = Date.now();
function tick() {
  const now = Date.now(), dt = Math.min(now - last, 5000); last = now;
  if (mode === 'play') {
    S.played += dt; S.streak += dt;
    if (S.played >= SHIFT) {
      mode = 'done'; fadeMusic(false); chime(); hideAlert();
      showAlert('done', 'Восемь часов отработано. Смена закрыта, выключай кассету.', [['Новая смена', () => $('reset').click()]]);
    } else if (S.streak >= FOCUS && now >= S.snoozeUntil && alertKind !== 'due') {
      const len = (S.breaks + 1) % 4 === 0 ? 20 : 10;
      chime(); notify('Пора сделать перерыв', `${len} минут: встань, пройдись, посмотри вдаль.`);
      showAlert('due', `Ты в фокусе ${fmtM(S.streak)}. Время на перерыв ${len} минут: встань, разомнись, посмотри в окно.`,
        [['Начать перерыв', startBreak, true], ['Ещё 10 минут', () => { S.snoozeUntil = Date.now() + SNOOZE; hideAlert(); }]]);
    }
  }
  if (mode === 'break' && breakEnd && now >= breakEnd) {
    endBreak(true); mode = 'ready';   // перерыв засчитан, ждём возвращения
    chime(); notify('Перерыв окончен', 'Возвращайся к работе.');
    showAlert('back', 'Перерыв окончен. Новый блок фокуса — 50 минут.', [['▶ Продолжить', play, true]]);
  }
  render();
}
setInterval(tick, 250);
setInterval(save, 5000);

function notify(title, body) {
  document.title = '● ' + title;
  setTimeout(() => document.title = 'Неоновая кассета', 15000);
  try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch {}
}

/* ---------- отрисовка ---------- */
const pad = n => String(n).padStart(2, '0');
const fmtH = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
const fmtMS = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
const fmtM = ms => { const m = Math.round(ms / MIN); return m >= 60 ? `${Math.floor(m / 60)} ч ${m % 60} мин` : `${m} мин`; };
const fmtTrack = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;

function renderTrack() {
  const t = TRACKS[S.ti];
  $('tName').textContent = t.name; $('tNum').textContent = `${pad(S.ti + 1)}/${pad(TRACKS.length)}`;
  $('tInfo').textContent = `${t.bpm} BPM · ${t.key}`;
  [...$('playlist').children].forEach((li, i) => li.classList.toggle('cur', i === S.ti));
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: 'Neon/Tape', album: 'Focus Shift' }); } catch {}
}
$('playlist').innerHTML = TRACKS.map((t, i) => `<li data-i="${i}"><span>${pad(i + 1)} · ${t.name}</span><span>${t.bpm} BPM · ${fmtTrack(t.len)}</span></li>`).join('');
$('playlist').onclick = e => { const li = e.target.closest('li'); if (li) skip(+li.dataset.i - S.ti); };

function render() {
  const now = Date.now(), t = TRACKS[S.ti];
  $('sess').firstChild.textContent = fmtH(S.played);
  $('shiftBar').style.width = Math.min(100, S.played / SHIFT * 100) + '%';
  const brkLeft = mode === 'break' ? breakEnd - now : 0;
  $('focus').textContent = mode === 'break' ? fmtMS(brkLeft) : fmtMS(S.streak);
  const pm = S.pauseMs + (mode === 'pause' ? now - pauseStart : 0);
  $('pauses').textContent = `${S.pauses} · ${Math.round(pm / MIN)}м`;
  $('breaks').textContent = S.breaks;
  $('tTime').textContent = `${fmtTrack(S.step / t.steps * t.len)} / ${fmtTrack(t.len)}`;
  $('state').textContent = { stop:'STOP', play:'▶ PLAY', pause:'❚❚ PAUSE', break:'☕ BREAK', ready:'READY', done:'■ END' }[mode];

  const p = $('play'); p.classList.toggle('on', mode === 'play');
  p.textContent = mode === 'play' ? '❚❚ PAUSE' : '▶ PLAY'; p.setAttribute('aria-label', mode === 'play' ? 'Пауза' : 'Играть');
  $('brk').textContent = mode === 'break' ? 'ЗАКОНЧИТЬ' : 'ПЕРЕРЫВ';

  let h;
  if (mode === 'stop') h = S.played ? `Смена на паузе: отработано <b>${fmtM(S.played)}</b>. Жми PLAY, чтобы продолжить.` : 'Нажми <b>PLAY</b>, чтобы начать смену. Музыка генерируется прямо в браузере, без интернета.';
  else if (mode === 'ready') h = 'Перерыв засчитан. Жми <b>PLAY</b>, когда будешь готов.';
  else if (mode === 'done') h = 'Смена закрыта. Завтра начнётся новая автоматически.';
  else if (mode === 'break') h = `Перерыв: осталось <b>${fmtMS(brkLeft)}</b>. Отойди от экрана, музыка подождёт.`;
  else if (S.shortInStreak >= 3) h = `<b>${S.shortInStreak} коротких пауз</b> за один блок. Фокус рвётся: лучше честный перерыв на 10 минут, чем дёргаться.`;
  else if (mode === 'pause') {
    const d = now - pauseStart;
    h = d >= LONG_PAUSE ? `Пауза ${fmtMS(d)} — засчитаю как перерыв, когда вернёшься.` : `Пауза ${fmtMS(d)}. После 5 минут она засчитается как перерыв.`;
  } else {
    const left = FOCUS - S.streak;
    h = left > 0 ? `До перерыва <b>${fmtM(left)}</b>. До конца смены ${fmtM(SHIFT - S.played)}.` : 'Перерыв просрочен. Глазам и спине он нужнее, чем кажется.';
  }
  $('hint').innerHTML = h;
}

/* ---------- катушки ---------- */
const hub = g => { let s = '<circle r="13" fill="#d9d3e3"/><circle r="6" fill="#07060b"/>'; for (let i = 0; i < 6; i++) s += `<rect x="-1.6" y="-11" width="3.2" height="4" fill="#07060b" transform="rotate(${i * 60})"/>`; g.innerHTML = s; };
hub($('hubL')); hub($('hubR'));
let ang = [0, 0], lastF = performance.now();
const RMIN = 18, RMAX = 44;
function frame(ts) {
  const dt = (ts - lastF) / 1000; lastF = ts;
  const t = TRACKS[S.ti], prog = S.step / t.steps;
  const rL = Math.sqrt(RMIN ** 2 + (RMAX ** 2 - RMIN ** 2) * (1 - prog));
  const rR = Math.sqrt(RMIN ** 2 + (RMAX ** 2 - RMIN ** 2) * prog);
  $('packL').setAttribute('r', rL.toFixed(1)); $('packR').setAttribute('r', rR.toFixed(1));
  $('tapeLines').innerHTML = `<path d="M${112 - rL} 107 L92 172 H248 L${228 + rR} 107"/>`;
  if (mode === 'play' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const v = 140; ang[0] += v / rL * dt * 57.3; ang[1] += v / rR * dt * 57.3;
  }
  $('hubL').setAttribute('transform', `translate(112 107) rotate(${ang[0] % 360})`);
  $('hubR').setAttribute('transform', `translate(228 107) rotate(${ang[1] % 360})`);
  if (analyser) {
    const buf = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(buf);
    let sum = 0; for (const b of buf) sum += ((b - 128) / 128) ** 2;
    const lvl = Math.min(1, Math.sqrt(sum / buf.length) * 6);
    $('vuL').style.width = lvl * 100 + '%'; $('vuR').style.width = Math.min(1, lvl * (.85 + Math.random() * .25)) * 100 + '%';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

renderTrack(); render();

/* PWA: регистрируем service worker только в собранной версии (где есть manifest) */
if (document.querySelector('link[rel="manifest"]') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0811">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Tape">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Неоновая кассета</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="deck">
  <header class="brand">
    <h1>Neon<span>/</span>Tape</h1>
    <small>FOCUS DECK · C-480</small>
  </header>

  <section class="body">
    <div class="cassette">
      <svg viewBox="0 0 340 214" role="img" aria-label="Кассета">
        <defs>
          <linearGradient id="cs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2236"/><stop offset="1" stop-color="#151119"/></linearGradient>
        </defs>
        <rect x="4" y="4" width="332" height="206" rx="14" fill="url(#cs)" stroke="#3a3148"/>
        <rect x="18" y="16" width="304" height="142" rx="8" fill="#ece6f5"/>
        <rect x="18" y="16" width="304" height="26" rx="8" fill="#ff4f9a"/>
        <rect x="18" y="34" width="304" height="8" fill="#ff4f9a"/>
        <text x="30" y="34" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="14" fill="#0a0811" letter-spacing="2">SIDE A</text>
        <text id="tNum" x="310" y="34" text-anchor="end" font-family="Share Tech Mono, monospace" font-size="13" fill="#0a0811">01/06</text>
        <text id="tName" x="30" y="60" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="15" fill="#0a0811" letter-spacing="1">NEON RAIN</text>
        <rect x="62" y="70" width="216" height="74" rx="37" fill="#07060b" stroke="#3a3148"/>
        <g id="tapeLines" stroke="#3b261c" stroke-width="2" fill="none"></g>
        <circle id="packL" cx="112" cy="107" r="40" fill="#3b261c"/>
        <circle id="packR" cx="228" cy="107" r="24" fill="#3b261c"/>
        <g id="hubL" transform="translate(112 107)"></g>
        <g id="hubR" transform="translate(228 107)"></g>
        <rect x="150" y="96" width="40" height="22" rx="3" fill="#120f18" stroke="#3a3148"/>
        <path d="M78 210 L92 172 H248 L262 210" fill="#120f18" stroke="#3a3148"/>
        <circle cx="112" cy="192" r="5" fill="#07060b"/>
        <circle cx="228" cy="192" r="5" fill="#07060b"/>
        <rect x="160" y="184" width="20" height="14" rx="2" fill="#07060b"/>
      </svg>
    </div>

    <div class="lcd" aria-live="polite">
      <div class="lcd-top">
        <div class="big" id="sess">00:00:00<span class="of"> / 08:00</span></div>
        <div class="state" id="state">STOP</div>
      </div>
      <div class="shift" title="Смена 8 часов, деление — 30 минут"><i id="shiftBar"></i><div class="ticks"></div></div>
      <div class="scale"><span>0ч</span><span>2ч</span><span>4ч</span><span>6ч</span><span>8ч</span></div>
      <div class="stats">
        <div><span>ФОКУС</span><b id="focus">00:00</b></div>
        <div><span>ПАУЗЫ</span><b id="pauses">0 · 0м</b></div>
        <div><span>ПЕРЕРЫВЫ</span><b id="breaks">0</b></div>
      </div>
      <div class="meta"><span id="tInfo">72 BPM · D MAJ</span><span id="tTime">0:00 / 3:20</span></div>
      <div class="vu" aria-hidden="true"><div id="vuL"></div><div id="vuR"></div></div>
    </div>

    <div class="alert" id="alert" hidden>
      <p id="alertText"></p>
      <div class="row" id="alertRow"></div>
    </div>

    <div class="keys">
      <button id="prev" aria-label="Предыдущий трек">◀◀</button>
      <button id="play" class="main" aria-label="Играть">▶ PLAY</button>
      <button id="next" aria-label="Следующий трек">▶▶</button>
      <button id="brk">ПЕРЕРЫВ</button>
    </div>
    <label class="vol" for="vol">VOL <input id="vol" type="range" min="0" max="100" value="70"></label>
  </section>

  <p class="hint" id="hint">Нажми <b>PLAY</b>, чтобы начать смену. Музыка генерируется прямо в браузере, без интернета.</p>

  <ul class="playlist" id="playlist"></ul>

  <div class="foot">
    <span>Блок 50 мин · перерыв 10 мин · каждый 4-й 20 мин</span>
    <button class="ghost" id="reset">Новая смена</button>
  </div>
</main>

<script src="app.js"></script>

</body>
</html>
